spring:
  application:
    name: profile-service
  datasource:
    url: ${PROFILE_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    format-sql: false
    open-in-view: false

server:
  port: 8081
  servlet:
    context-path: /profile

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA}

app:
  config:
    url: http://localhost:8088