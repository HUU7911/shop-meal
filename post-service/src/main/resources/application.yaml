spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
  application:
    name: post-service
  mongodb:
    uri: ${POST_DB} # mongodb://root:huumod7911@localhost:27017/post_db?authSource=admin
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8089
  servlet:
    context-path: /post

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA}

app:
  config:
    file-url: http://localhost:8088
    profile-url: http://localhost:8081
    product-url: http://localhost:8083