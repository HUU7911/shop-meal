spring:
  application:
    name: file-service
  mongodb:
    uri: ${FILE_URL}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

server:
  port: 8088
  servlet:
    context-path: /file

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA}

app:
  localDir: "./upload"
  download: "http://localhost:8888/api/v1/file/media/download/"

minio:
  config:
    endpoint: ${ENDPOINT}
    accessKey: ${ACCESS_KEY}
    secretKey: ${SECRET_KEY}
    bucket: shop-meal-images