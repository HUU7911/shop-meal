server:
  port: 8888

app:
  api-prefix: /api/v1
  pre-auth:
    limit: 600            # tối đa 600 request mỗi cửa sổ cho mỗi IP, mọi route cộng lại
    window-seconds: 60
    blocked-paths: /notification/email/send
    skip-paths: /file/media/download

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@baselineKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
          routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=${app.api-prefix}/identity/**
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1

#            rate limiting endpoint login
            - id: identity-login
              order: -10
              uri: lb://identity-service
              predicates:
                - Path=${app.api-prefix}/identity/auth/login
                - Method=POST
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 60
                    redis-rate-limiter.requestedTokens: 3

            # Cac endpoint public con lai cua identity-service
            - id: identity-sensitive
              order: -9
              uri: lb://identity-service
              predicates:
                - Path=${app.api-prefix}/identity/auth/verify-otp,${app.api-prefix}/identity/auth/forgot-password,${app.api-prefix}/identity/auth/reset-password,${app.api-prefix}/identity/users/create
                - Method=POST
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 60
                    redis-rate-limiter.requestedTokens: 12

            - id: profile-service
              uri: lb://profile-service
              predicates:
                - Path=${app.api-prefix}/profile/**
              filters:
                - StripPrefix=2

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=${app.api-prefix}/notification/**
              filters:
                - StripPrefix=2

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=${app.api-prefix}/product/**
              filters:
                - StripPrefix=2

            - id: search-service
              uri: lb://search-service
              predicates:
                - Path=${app.api-prefix}/search/**
              filters:
                - StripPrefix=2

            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=${app.api-prefix}/cart/**
              filters:
                - StripPrefix=2

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=${app.api-prefix}/order/**
              filters:
                - StripPrefix=2

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=${app.api-prefix}/payment/**
              filters:
                - StripPrefix=2

            - id: file-service
              uri: lb://file-service
              predicates:
                - Path=${app.api-prefix}/file/**
              filters:
                - StripPrefix=2

            - id: post-service
              uri: lb://post-service
              predicates:
                - Path=${app.api-prefix}/post/**
              filters:
                - StripPrefix=2

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/