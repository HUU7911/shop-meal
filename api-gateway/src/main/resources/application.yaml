server:
  port: 8888

app:
  api-prefix: /api/v1

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=${app.api-prefix}/identity/**
              filters:
                - StripPrefix=2

            - id: profile-service
              uri: lb://profile-service
              predicates:
                - Path=${app.api-prefix}/profile/**
              filters:
                - StripPrefix=2

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=${app.api-prefix}/notification/**
              filters:
                - StripPrefix=2

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=${app.api-prefix}/product/**
              filters:
                - StripPrefix=2

            - id: search-service
              uri: lb://search-service
              predicates:
                - Path=${app.api-prefix}/search/**
              filters:
                - StripPrefix=2

            - id: cart-service
              uri: lb://cart-service
              predicates:
                - Path=${app.api-prefix}/cart/**
              filters:
                - StripPrefix=2

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=${app.api-prefix}/search/**
              filters:
                - StripPrefix=2

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/